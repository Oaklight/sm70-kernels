[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sm70-kernels"
version = "0.1.0"
description = "GPU kernels for NVIDIA V100 (SM70) inference: long-context split-KV decode and TileLang FlashAttention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.4"]

[tool.setuptools.packages.find]
include = ["sm70_kernels*"]

[tool.setuptools.package-data]
"sm70_kernels.longctx_decode" = ["csrc/*.cu"]
